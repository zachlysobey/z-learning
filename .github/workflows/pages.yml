# Build the GitHub Pages site (main page → topic landing pages → lessons) and
# deploy it. Runs on every push to main; the site is generated by
# tools/build-site.py, which discovers topics and lessons on its own.
#   https://zachlysobey.github.io/z-learning/
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # The LaTeX topics publish their built PDFs, so build them first.
      - name: Cache tectonic package bundle
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('**/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-

      - uses: wtfjoke/setup-tectonic@v4

      - name: Build PDFs
        run: |
          for f in */*.tex; do
            tectonic --outdir "$(dirname "$f")" "$f"
          done

      - name: Build site
        run: python3 tools/build-site.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
